<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Brotato</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">

<style>
body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
#canvas { display: block; width: 100vw !important; height: 100vh !important; position: fixed; top: 0; left: 0; border: none; outline: none; object-fit: fill; }

#status { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: radial-gradient(ellipse at center, #292319, #100f0d 75%); color: #fff3d9; font-family: Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
#status h1 { margin: 0 0 12px; font-size: clamp(48px, 13vw, 100px); font-weight: 900; letter-spacing: 5px; color: #ffd078; text-shadow: 0 5px 0 #795026; }
#status .note { color: #d0c5b4; font-size: 15px; }
#loading-track { width: min(440px, 85vw); height: 20px; background: #393228; border: 2px solid #726044; border-radius: 12px; overflow: hidden; }
#loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #cc8c35, #ffe09b); transition: width .2s ease; }
#loading-detail { font-size: 14px; color: #d0c5b4; }
#status.error #loading-track { display: none; } }
</style>
<script src="https://cdn.jsdelivr.net/gh/gzuidhof/coi-serviceworker@latest/coi-serviceworker.min.js"></script>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">
    <h1>BROTATO</h1>
    <div id="loading-label">Loading Brotato...</div>
    <div class="note">Loading for the first time can take a minute.</div>
    <div id="loading-track" role="progressbar" aria-label="Loading Brotato" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-bar"></div></div>
    <div id="loading-detail">0% — 0.00 / 160.00 MB</div>
</div>

<script>
(function() {
'use strict';
const HASH = "20b998679f3a2a598bf5c10a5dd8422b47272a04";
const BASE = `https://cdn.jsdelivr.net/gh/aahspaghetticode/ignore@${HASH}/`;
const TOTAL_BYTES = 147972096 + 19796835;
const TOTAL_MB = (TOTAL_BYTES / 1048576).toFixed(2);

const originalFetch = window.fetch;
const mergedData = {};
const pendingRequests = {};
let bytesLoadedSoFar = 0;

const statusEl = document.getElementById('status');

function updateStatus(currentBytes) {
    const currentMB = (currentBytes / 1048576).toFixed(2);
    const percent = Math.min(99, currentBytes / TOTAL_BYTES * 100);
    document.getElementById('loading-bar').style.width = percent + '%';
    document.getElementById('loading-track').setAttribute('aria-valuenow', Math.round(percent));
    document.getElementById('loading-detail').textContent = `${Math.round(percent)}% — ${currentMB} / ${TOTAL_MB} MB`;
    if (currentBytes >= TOTAL_BYTES) document.getElementById('loading-label').textContent = 'Starting Brotato...';
}

window.fetch = function(url, ...args) {
    const u = url.toString();
    if (u.includes("Brotato.pck") || u.includes("Brotato.wasm")) {
        const f = u.includes(".pck") ? "Brotato.pck" : "Brotato.wasm";
        if (mergedData[f]) return Promise.resolve(new Response(mergedData[f]));
        return new Promise((resolve) => {
            if (!pendingRequests[f]) pendingRequests[f] = [];
            pendingRequests[f].push(resolve);
        });
    }
    return originalFetch(url, ...args);
};

async function merge(name, start, end) {
    const bufs = [];
    for (let i = start; i <= end; i++) {
        const url = BASE + encodeURIComponent(name + ".part" + i);
        const r = await originalFetch(url);
        if (!r.ok) throw new Error();
        const data = await r.arrayBuffer();
        bufs.push(data);
        bytesLoadedSoFar += data.byteLength;
        updateStatus(bytesLoadedSoFar);
    }
    const b = new Blob(bufs, { type: 'application/octet-stream' });
    mergedData[name] = b;
    if (pendingRequests[name]) {
        pendingRequests[name].forEach(res => res(new Response(b)));
        delete pendingRequests[name];
    }
}

async function fetchSingle(name) {
    const url = BASE + encodeURIComponent(name);
    const r = await originalFetch(url);
    if (!r.ok) throw new Error();
    const data = await r.arrayBuffer();
    bytesLoadedSoFar += data.byteLength;
    updateStatus(bytesLoadedSoFar);
    const b = new Blob([data], { type: 'application/octet-stream' });
    mergedData[name] = b;
    if (pendingRequests[name]) {
        pendingRequests[name].forEach(res => res(new Response(b)));
        delete pendingRequests[name];
    }
}

function showError(error) {
    statusEl.classList.add('error');
    document.getElementById('loading-label').textContent = 'Loading failed. Refresh to try again.';
    document.getElementById('loading-detail').textContent = error.message || 'Could not load game files.';
    console.error(error);
}

async function init() {
    try {
        await merge("Brotato.pck", 0, 8);
        await fetchSingle("Brotato.wasm");

        const s = document.createElement('script');
        s.src = BASE + "Brotato.js";
        s.onerror = () => showError(new Error("Could not load Brotato.js"));
        s.onload = async () => {
          try {
            const engine = new Engine({
                "args":[],
                "canvasResizePolicy":2,
                "executable":"Brotato",
                "experimentalVK":false,
                "fileSizes":{"Brotato.pck":147972096,"Brotato.wasm":19796835},
                "focusCanvas":true,
                "gdnativeLibs":[]
            });

            await engine.startGame({
                onProgress: (current, total) => {
                    if (total > 0) {
                        updateStatus(bytesLoadedSoFar);
                    }
                }
            }).then(() => {
                statusEl.style.display = 'none';
                window.dispatchEvent(new Event('resize'));
            });
          } catch (e) { showError(e); }
        };
        document.body.appendChild(s);
    } catch (e) {
        showError(e);
    }
}
init();
})();
</script>
</body>
</html>
